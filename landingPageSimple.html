<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page Simple</title>
    <link href="styles.css" rel="stylesheet">
</head>

<body>
  <div class="land-contenedor">
    <header class="land-encabezado">
      <h1>Mi Landing Page</h1>
    </header>

    <section class="land-hero">
      <div class="land-contenido-hero">
        <h2>Bienvenido a mi sitio</h2>
        <button class="land-boton">Comenzar</button>
      </div>
    </section>

    <main class="land-principal">
      <article class="land-caja">
        <h3>Sobre nosotros</h3>
        <p>Somos lo que somos.</p>
      </article>

      <article class="land-caja">
        <h3>Servicios</h3>
        <p>Ofrecemos soluciones simples y efectivas.</p>
      </article>

      <article class="land-caja">
        <h3>Contacto</h3>
        <p>Contáctanos para más información.</p>
      </article>
    </main>

    <footer class="land-pie">
      <p>© Pagiana Landing</p>
    </footer>
  </div>
</body>
</html>
